name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - name: Typecheck, unit tests, generated files, no dash scan, contrast
        run: npm run check
      - name: Database migration and sync functions on real Postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          npm run test:sql
      - name: End to end (two devices, offline, export and import, accessibility)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
