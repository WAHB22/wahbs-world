<script type="module">
import { run, plan, U, C } from "../kit/engine.js";
const { prog, clamp, rnd, within, lerp, ease, outCubic } = U;

// ---------------- timeline (seconds) ----------------
const T = plan(8, 3, [5.4, 2.8, 4.8, 5.4, 8.6, 7.4, 6.2]);
const [s0, s1, s2, s3, s4, s5, s6, s7] = T.steps;
const E = {
  lucas: s0 + 0.9, jonah: s0 + 3.4,
  relay: s1 + 0.3, warmEnd: s3 - 0.9, settle: s3 - 0.1, printStart: s3 + 0.3,
  fail: s4 + 0.4, detect: s4 + 1.9, alertIn: s4 + 2.3, tapShut: s4 + 3.6, confirmIn: s4 + 4.0, tapConfirm: s4 + 4.9, logged: s4 + 5.4, stop: s4 + 5.7,
  amira: s5 + 0.4, on2: s5 + 1.0, rise: s5 + 1.6, hot: s5 + 3.4, cut2: s5 + 3.7, alert2: s5 + 4.2, tapTech: s5 + 6.0, logged2: s5 + 6.5,
  priya: s6 + 0.4, on3: s6 + 1.0, cut3: s6 + 4.4,
};
const POWER = [[E.relay, E.stop], [E.on2, E.cut2], [E.on3, E.cut3]];
const GRAMS = (t) => Math.round(24 * clamp((t - E.printStart) / (E.fail - E.printStart)));
const warming = (t) => (t >= E.relay + 0.2 && t < E.settle) || (t >= E.on3 + 0.2 && t < E.cut3);
const printing = (t) => (t >= E.printStart && t < E.stop) || (t >= E.on2 + 0.4 && t < E.cut2);
const extruding = (t) => (t >= E.printStart && t < E.fail) || (t >= E.on2 + 0.4 && t < E.cut2);

// illustrative readings
const normalI = (tt) => 0.5 + 0.11 * Math.tanh(3 * Math.sin(tt * 6.5)) + (rnd(Math.floor(tt * 10)) - 0.5) * 0.06;
function current(tt) {
  if (tt < E.relay + 0.15 || tt >= E.stop) return 0;
  const warm = 0.9 + (rnd(Math.floor(tt * 10) + 3) - 0.5) * 0.06;
  if (tt < E.warmEnd) return warm * outCubic(prog(tt, E.relay + 0.15, E.relay + 0.6));
  if (tt < E.settle) return lerp(warm, normalI(tt), ease(prog(tt, E.warmEnd, E.settle)));
  return normalI(tt);
}
const bandAt = (tt) => { const k = ease(prog(tt, E.warmEnd, E.settle)); return [lerp(0.78, 0.32, k), lerp(1.05, 0.7, k)]; };
const gramsLine = (tt) => (tt < E.printStart ? 0 : 0.04 + GRAMS(tt) / 24 * 0.86 + (tt < E.fail ? (rnd(Math.floor(tt * 10)) - 0.5) * 0.015 : 0));
const chamber = (tt) => {
  const base = 0.34 + (rnd(Math.floor(tt * 10) + 2) - 0.5) * 0.03;
  if (tt < E.on2) return 0.2;
  if (tt < E.rise) return lerp(0.2, base, prog(tt, E.on2, E.on2 + 0.5));
  if (tt < E.cut2) return base + 0.56 * ease(prog(tt, E.rise, E.hot + 0.2));
  return base + 0.56 - 0.3 * prog(tt, E.cut2, E.cut2 + 3.5);
};
const holdI = (tt) => (tt < E.on3 + 0.15 || tt >= E.cut3 ? 0 : 0.62 + (rnd(Math.floor(tt * 10) + 5) - 0.5) * 0.05);

const ICONFLAG = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 21V4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M5.5 4h12l-3 4.5 3 4.5h-12z" fill="currentColor"/></svg>';

run({
  name: "Enclosed printer module", machine: "3D printer 2", kicker: "PREVUMO · PD B3 concept", sysTitle: "On the printer",
  sub: "The 3D printer box on an enclosed, Ultimaker-style printer, with one more sensor: the air inside the enclosure.",
  T,
  box: { glands: 4, outlet: true, relay: ["15 A", "120 V"], ct: true },
  parts: [
    { key: "reader" },
    { key: "disp" },
    { key: "qr", role: "Opens the 3D printer 2 manual." },
    { key: "cover" },
    { key: "board", role: "ESP32 with Wi-Fi and a current sensor." },
    { key: "relay", role: "Certified, 15 A at 120 V. Switches the printer." },
    { key: "psu", role: "Runs the box from the same outlet." },
    { key: "base", role: "Wall mount, cord to the wall, outlet for the printer." },
    { ref: "scale", name: "Spool scale", role: "Load cells under both spools: grams per session.", a: [2.6, -0.7, 8], d: [100, 40] },
    { ref: "usb", name: "Printer link", role: "USB cable: reads the job, can pause it.", a: [-1.3, 0, 0.4], d: [-150, -20] },
    { ref: "chamber", name: "Chamber sensor", role: "Air temperature inside the enclosure.", a: [0, 1.6, 0.4], d: [-70, -120] },

    ["Heats up first: that's normal", "The bed and nozzles heat first, so the current is high. PREVUMO knows this warm-up and raises no alert."],
    ["Prints and weighs filament", "The current settles into its normal range and the scale counts grams. The first two weeks only learn the normal range."],
    ["Failed print? Pause", "Print time far past the estimate, or the spools stop losing weight: the box pauses the job and alerts the member."],
    ["Chamber too hot? Off", "If the air inside the enclosure passes the owner's limit, the box cuts power first, then alerts the owner."],
    ["Left heating? Power off", "Heaters on and nothing moving for the time the owner sets: the relay cuts power."],

    [s2 - 0.2, 38, 104, 20, 36, 15, 108, -13, 50],
    [s2 + 0.8, 34, 100, 20, 30, 13, 112, -20, 50],
    [s5 - 0.4, 34, 100, 20, 35, 14, 112, -20, 50],

    [E.lucas, ["Checking fob", "Printer 2 trained list"]],
    [E.lucas + 0.6, ["Locked", "Not trained on this machine"]],
    [s0 + 2.8, ["Tap your fob", "PREVUMO · 3D printer 2"]],
    [E.jonah, ["Checking fob", "Printer 2 trained list"]],
    [E.jonah + 0.6, ["Hi, Jonah", "Trained · unlocking"]],
    [s1, ["Hi, Jonah", "Power on"]],
    [s2, ["Warming up", "Normal for this printer"]],
    [E.printStart, (t) => ["Jonah · printing", `Filament: ${GRAMS(t)} g`]],
    [E.detect, ["Print paused", "Extrusion stopped"]],
    [E.stop, ["Stopped by Jonah", "Filament 24 g · logged"]],
    [s5, ["Tap your fob", "PREVUMO · 3D printer 2"]],
    [E.amira, ["Checking fob", "Printer 2 trained list"]],
    [E.on2, ["Hi, Amira", "Power on"]],
    [E.on2 + 0.6, (t) => ["Amira · printing", `Chamber ${Math.round(32 + 40 * clamp((chamber(t) - 0.34) / 0.56))} °C`]],
    [E.cut2, ["Chamber too hot", "Power off · owner told"]],
    [s6, ["Tap your fob", "PREVUMO · 3D printer 2"]],
    [E.priya, ["Checking fob", "Printer 2 trained list"]],
    [E.on3, ["Hi, Priya", "Power on"]],
    [E.on3 + 0.8, (t) => ["Heating", `No print · ${Math.min(20, Math.floor((t - E.on3 - 0.8) / (E.cut3 - E.on3 - 0.8) * 20))} min`]],
    [E.cut3, ["Heated 20 min", "with no print · Power off"]],
  ],
  light: [[0, "idle"], [E.lucas + 0.5, "rust"], [s0 + 2.8, "idle"], [E.jonah + 0.6, "green"], [E.detect, "orange"], [E.stop, "rust"], [s5, "idle"],
    [E.on2, "green"], [E.hot - 0.8, "orange"], [E.cut2, "rust"], [s6, "idle"], [E.on3, "green"], [E.on3 + 2.4, "orange"], [E.cut3, "rust"], [T.end, "idle"]],
  sessions: [[E.relay, E.stop], [E.on2, s6], [E.on3, E.cut3 + 0.6]],
  alarm: [[E.detect, E.stop], [E.hot - 0.8, s6], [E.cut3 - 0.4, E.cut3 + 0.6]],
  charts: [
    { in: s2 + 0.2, out: s3 + 1.0, title: "3D printer 2 · current", ta: s1, tb: s3 + 1.5, I: current, band: bandAt,
      bandText: "normal range, learned in weeks 1 and 2",
      flags: [{ tt: s2 + 1.6, at: s2 + 1.2, text: "warm-up: normal", tone: "ok", y: 1.08 }],
      tag: (t) => (warming(t) ? ["Warming up · normal", "warm"] : ["Normal range", "ok"]) },
    { in: s3 + 1.6, out: s5 - 0.3, title: "Filament used", ta: E.printStart, tb: s5 - 0.2, I: gramsLine, unit: "grams, spool scale",
      flags: [{ tt: E.fail, at: E.fail + 1.0, text: "no change", tone: "warn", y: 0.98 }],
      lineCol: (t) => (t >= E.stop ? C.idlemark : C.green), hot: (tt) => tt >= E.fail && tt < E.stop,
      tag: (t) => (t >= E.stop ? ["Shut down", "off"] : t >= E.detect ? ["Paused", "irr"] : t >= E.fail + 1.0 ? ["Extrusion stopped", "hot"] : ["Printing", "ok"]) },
    { in: s5 + 0.6, out: s6 - 0.3, title: "Chamber temperature", ta: s5 + 0.6, tb: s6 - 0.2, I: chamber, unit: "inside air",
      guide: { v: 0.78, text: "limit set by the owner" }, hot: (tt, v) => v > 0.78,
      lineCol: (t) => (t >= E.cut2 ? C.idlemark : C.green),
      tag: (t) => (t >= E.cut2 ? ["Power off", "off"] : t >= E.hot ? ["Too hot", "hot"] : ["Normal", "ok"]) },
    { in: s6 + 0.6, out: s7 - 0.1, title: "Heaters on, no motion", ta: s6 + 0.6, tb: s7, I: holdI,
      guide: { v: 0.82, text: "owner limit: 20 min" },
      tag: (t) => (t >= E.cut3 ? ["Power off", "off"] : t >= E.on3 ? ["Heating, no print", "warm"] : ["Idle", "idle"]) },
  ],
  alerts: [
    { in: E.alertIn, out: E.logged + 0.9, tone: "paused", badge: "Paused · check the print", title: "3D printer 2 · failed print?", label: "Jonah's phone · illustrative",
      phases: [
        { at: E.alertIn, reason: "The spools stopped losing weight 6 min ago. Job paused.", buttons: ["off", "tech", "gap", "ok"], ring: 0, tap: E.tapShut },
        { at: E.confirmIn, reason: "The printer will stop and won't restart on its own.", buttons: ["cancel", "gap", "confirm"], ring: 2, tap: E.tapConfirm },
        { at: E.logged, reason: "Power is off. Logged for Jonah's session.", logged: "Decision logged: Shut down" },
      ] },
    { in: E.alert2, out: s6 - 0.1, tone: "safety", badge: "Safety · stopped first", title: "3D printer 2 · chamber too hot",
      phases: [
        { at: E.alert2, reason: "Power off automatically. Amira Haddad was printing.", buttons: ["tech", "gap", "ok"], ring: 0, tap: E.tapTech },
        { at: E.logged2, reason: "The printer stays off until it is checked.", logged: "Decision logged: Call technician" },
      ] },
  ],
  cards: [
    { in: E.logged + 1.2, out: s5 + 0.2, top: 494, html: () => `<p class="lbl">Owner app · Members · illustrative</p>
      <p class="tt" style="margin-top:10px">Jonah Okafor · 3D printer 2</p>
      <div class="rows"><div class="r"><span class="k">Session</span><b>2 h 10 min</b></div>
      <div class="r"><span class="k">Filament</span><b>24 g, billed at $0.10 a gram: $2.40</b></div>
      <div class="r"><span class="k">Result</span><b>Failed print, paused at 58%</b></div></div>
      <span class="chip ok">${ICONFLAG}Added to Jonah's record</span>` },
  ],
  tags: [

    { text: "Jonah: trained", tone: "ok", obj: "reader", a: [-2.6, -5.2, 3.2], d: [-40, 190], in: E.jonah + 0.6, out: s1 + 0.3, ctx: false },
    { text: "Heating up: normal", tone: "ok", obj: "pr", a: [-9, 3, 18], d: [-40, 90], in: s2 + 0.8, out: s3 - 0.2 },
    { text: "Spool scale · grams per session", tone: "ok", obj: "scale", a: [0, 8, -8], d: [-250, -150], in: s3 + 0.6, out: s4 + 0.2 },
    { text: "Spools stopped turning", tone: "warn", icon: "warn", obj: "scale", a: [0, 8, -8], d: [-250, -150], in: E.fail + 1.0, out: E.stop + 0.4 },
    { text: "Chamber too hot", tone: "warn", icon: "warn", obj: "chamber", a: [0, 1.6, 0.4], d: [-150, -70], in: E.hot, out: s6 - 0.1 },
    { text: "Power off", tone: "bad", icon: "stop", obj: "bed", a: [-12, 39.4, 12], d: [-130, 40], in: E.cut2, out: s6 - 0.1 },
    { text: "Heated 20 min, no print", tone: "warn", icon: "warn", obj: "bed", a: [-12, 39.4, 12], d: [-170, 40], in: E.on3 + 2.4, out: E.cut3 },
    { text: "Power off", tone: "bad", icon: "stop", obj: "bed", a: [-12, 39.4, 12], d: [-130, 40], in: E.cut3, out: s7 - 0.1 },
  ],
  about: "The enclosed printer module is the 3D printer box on an enclosed, Ultimaker-style printer, whose glass plate drops as the print grows. A member's NFC fob unlocks it if that fob is on the printer's trained list. Load cells under the spools count the grams each member uses, a USB link lets the box pause a failed job, the relay cuts power when the heaters are left on with nothing printing, and a sensor inside the enclosure cuts power if the air gets too hot. The warm-up spike is normal and raises no alert.",
  evidence: [
    "Yukonstruct (Rick Yorgason, Oct 27): “we wouldn't want it to be a personal code, we would want it to be an NFC fob.”",
    "University of Regina charges $0.10 a gram for 3D printing; Grey Bruce Makers bills filament by weight.",
    "Nozzles run at 250 °C and more, and guidance says to check prints every 30 minutes (Alveo3D).",
  ],
  chapters: [{ label: "Failed print", at: [s4, s5], still: 4.0 }, { label: "Chamber too hot", at: [s5, s6], still: 5.0 }, { label: "Left heating", at: [s6, T.end], still: 4.8 }],

  scene(api) {
    const { THREE, C, ctx, cm, mk, RB, CYL, toon, canvasTex, texPlane, curve, tube, beads, wallOutlet, LineMaterial, LineGeometry, Line2, lineMats } = api;
    const S = {};
    ctx.add(cm(RB(28, 40, 1.2, 0.4), C.idle, { p: [1, 96, -3.6] }));
    wallOutlet(-6.5, 81.5);
    ctx.add(cm(RB(2.4, 2.8, 1.8, 0.45), C.ink, { p: [-6.5, 83.2, -1.6] }));
    ctx.add(cm(RB(2.6, 2.2, 1.8, 0.45), C.ink, { p: [8.75, 95.4, -0.8] }));

    for (const [x, z] of [[11, 1.5], [75, 1.5], [11, 44.5], [75, 44.5]]) ctx.add(cm(RB(3, 69, 3, 0.4), C.border, { p: [x, 34.5, z] }));
    // enclosed box-frame printer (generic): the head runs on cross rods at the top, the glass plate drops as the print grows
    const pr = new THREE.Group(); pr.position.set(46, 72, 22); ctx.add(pr); S.pr = pr;

    const prLcd = texPlane(8, 3.4, S.prTex, true); prLcd.position.set(-9, 5.4, 18.04); pr.add(prLcd);
    pr.add(cm(CYL(1.3, 1.2), C.ink, { p: [2, 5.4, 18.3], r: [Math.PI / 2, 0, 0] }));
    pr.add(cm(RB(1.6, 43, 36, 0.4), C.surface, { p: [-17.2, 31.5, 0] }));
    pr.add(cm(RB(36, 43, 1.6, 0.4), C.surface, { p: [0, 31.5, -17.2] }));
    for (const [x, z] of [[17, -17], [17, 17], [-17, 17]]) pr.add(cm(RB(2, 43, 2, 0.4), C.surface, { p: [x, 31.5, z] }));
    pr.add(cm(RB(36, 3, 2, 0.4), C.surface, { p: [0, 54.5, 17] }));
    pr.add(cm(RB(36, 3, 2, 0.4), C.surface, { p: [0, 54.5, -17] }));
    for (const x of [-17, 17]) pr.add(cm(RB(2, 3, 36, 0.4), C.surface, { p: [x, 54.5, 0] }));
    pr.add(cm(RB(30, 0.6, 0.8, 0.2), C.gtint, { p: [0, 52.6, 15.8], outline: false }));
    for (const x of [-15.5, 15.5]) pr.add(cm(CYL(0.45, 32, 12), C.idlemark, { p: [x, 49, 0], r: [Math.PI / 2, 0, 0] }));
    for (const z of [-15.5, 15.5]) pr.add(cm(CYL(0.45, 32, 12), C.idlemark, { p: [0, 49.8, z], r: [0, 0, Math.PI / 2] }));
    S.rodX = cm(CYL(0.38, 31, 12), C.muted, { r: [0, 0, Math.PI / 2] }); S.rodX.position.y = 48.2; pr.add(S.rodX);
    S.rodZ = cm(CYL(0.38, 31, 12), C.muted, { r: [Math.PI / 2, 0, 0] }); S.rodZ.position.y = 47.4; pr.add(S.rodZ);
    S.HEAD_Y = 44.2;

    S.head.add(cm(CYL(1.9, 0.4, 24), C.idlemark, { p: [0, 0.4, 3.3], r: [Math.PI / 2, 0, 0] }));

    const PLATE_TOP = 39.7;
    S.bed = new THREE.Group(); pr.add(S.bed);
    S.bed.add(mk(RB(30, 1.2, 30, 0.3), null, { mat: toon(C.inkSoft, true), ctx: true, p: [0, PLATE_TOP - 1.2, 0] }));
    S.bed.add(cm(RB(27, 0.6, 27, 0.2), C.gtint, { p: [0, PLATE_TOP - 0.3, 0] }));
    S.bed.add(cm(RB(2.4, 1.2, 14, 0.3), C.ink, { p: [0, PLATE_TOP - 1.6, -8.6] }));
    pr.add(cm(CYL(0.55, 40, 12), C.idlemark, { p: [0, 30, -14.6] }));
    // chamber sensor high on the inside of the back panel
    const chamber = new THREE.Group(); chamber.position.set(56, 117, 5.8); ctx.add(chamber); S.chamber = chamber;
    chamber.add(cm(RB(3.2, 3.6, 0.9, 0.3), C.ink));
    S.chMat = new THREE.MeshBasicMaterial({ color: C.green, transparent: true }); api.ctxMats.push(S.chMat);
    const chLed = new THREE.Mesh(new THREE.CircleGeometry(0.55, 20), S.chMat); chLed.position.set(0, 0.6, 0.47); chamber.add(chLed);
    // two spools on a scale shelf on the right side, feeding the head through tubes over the top
    const scale = new THREE.Group(); scale.position.set(69, 96.4, 22); ctx.add(scale); S.scale = scale;
    scale.add(cm(RB(9, 1.4, 32, 0.4), C.idlemark));
    for (const z of [-8, 8]) scale.add(cm(RB(2.4, 0.8, 2.4, 0.2), C.ink, { p: [0, -1.0, z] }));
