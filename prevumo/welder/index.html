const POWER = [[E.contClose, E.stop], [E.idleOn, E.autoOff], [E.p2on, E.detect + 0.05]];

const WIRE = (t) => Math.round(42 * clamp((t - (E.contClose + 0.6)) / (s3 - E.contClose - 0.6)));

// the welder's current, as the app would chart it (illustrative)
function current(tt) {
  if (tt < E.contClose + 0.6) return 0;
  if (tt >= E.stop) return 0;
  const base = 0.62 + (rnd(Math.floor(tt * 10)) - 0.5) * 0.09 + Math.sin(tt * 2.1) * 0.025;
  if (tt < E.spike) return base;
  const k = tt - E.spike;
  if (k < 2.2) return base + [0.15, 0.52, 0.2, 0.68, 0.31, 0.6, 0.42][Math.floor(k / 0.32) % 7];
  return 0.98 + (rnd(Math.floor(tt * 10) + 7) - 0.5) * 0.2;
}
const idleCurrent = (tt) => (tt >= E.idleOn && tt < E.autoOff ? 0.05 + rnd(Math.floor(tt * 10)) * 0.025 : 0);
// the leak sensor near the regulator (illustrative)
const gasLevel = (tt) => {
  const base = 0.14 + (rnd(Math.floor(tt * 10) + 3) - 0.5) * 0.05;
  if (tt < E.leak) return base;
  const up = clamp((tt - E.leak) / (E.detect + 0.2 - E.leak));
  const down = clamp((tt - E.detect - 0.8) / 4.5) * 0.35;
  return base + up * 0.74 - down;
};

      const f = new THREE.Mesh(new THREE.CircleGeometry(1, 48), m); f.rotation.x = -Math.PI / 2; f.position.set(x, 0.05, z); f.scale.set(sx, sz, 1); ctx.add(f);
    }
    // cables, hose and signal wires (the four glands, left to right: clamp, contactor, valve, leak sensor)
    S.PATH = {
      supplyIn: curve([[-26, 113, 0.4], [-26, 109, 1.6], [-26, 105.2, 1.8]]),
      supplyOut: curve([[-26, 96.2, 1.8], [-26, 89, 1.8], [-26, 80, 2.4], [-24, 62, 2.6], [-10, 38, 0.8], [12, 28, -1.6], [27, 26.5, -1.8], [34, 26.5, -1.2]]),
      ctSig: curve([[-24.2, 89, 1.8], [-17, 87.2, -1.6], [-8, 86, -2.0], [-4.5, 86.8, -1.4], [-4.5, 89.2, -0.8]]),
      ctrlCont: curve([[-1.5, 89.2, -0.8], [-1.5, 85.6, -2.0], [-9, 84.4, -2.3], [-19, 88, -2.2], [-22.6, 95, 0.3], [-23.2, 99, 1.0]]),
      ctrlValve: curve([[1.5, 89.2, -0.8], [1.5, 85.4, -2.1], [16, 83.6, -2.4], [42, 80.6, -2.4], [52, 77.8, -1.7], [55.2, 76.2, -0.2]]),
      leakSig: curve([[65.6, 91, -2.4], [58, 90.2, -2.6], [30, 88.8, -2.6], [8, 87.2, -2.4], [4.5, 87.4, -1.6], [4.5, 89.2, -0.8]]),
      gasIn: curve([[76.8, 80.4, 9], [70, 80.6, 7.8], [63, 77, 3.4], [58.8, 74, 0]]),
      gasOut: curve([[53.2, 74, 0], [50.4, 68, -1.6], [47.6, 48, -2.4], [46.2, 34, -1.8], [46, 30, -1.1]]),
    };
    const P = S.PATH;
    tube(P.supplyIn, 0.75, C.ink, { seg: 30 }); tube(P.supplyOut, 0.75, C.ink, { seg: 160 });
    tube(P.gasIn, 0.55, C.muted, { seg: 60 }); tube(P.gasOut, 0.55, C.muted, { seg: 80 });
    for (const k of ["ctSig", "ctrlCont", "ctrlValve", "leakSig"]) tube(P[k], 0.26, C.idlemark, { outline: false, seg: 120 });
    // current clamp around one supply wire, in two hinged halves
    const ct = new THREE.Group(); ct.position.set(-26, 89, 1.8); ctx.add(ct); S.ct = ct;
    const ringProf = [[1.0, -0.9], [2.0, -0.9], [2.0, 0.9], [1.0, 0.9], [1.0, -0.9]].map(([x, y]) => new THREE.Vector2(x, y));
    ct.add(cm(new THREE.LatheGeometry(ringProf, 24, 0, Math.PI), C.ink));
    S.ctHinge = new THREE.Group(); ct.add(S.ctHinge);
    S.ctB = cm(new THREE.LatheGeometry(ringProf, 24, Math.PI, Math.PI), C.ink); S.ctHinge.add(S.ctB);
    ct.add(cm(RB(1.2, 1.4, 1.6, 0.3), C.idlemark, { p: [1.9, 0, 0] }));
    // flow beads
    S.B = { power: beads(22, 0.95, C.green), gas: beads(16, 0.78, C.surface), sig: beads(6, 0.55, C.gtint), cmd: beads(6, 0.75, C.green), cloud: beads(14, 0.9, C.otint) };
    return S;
  },

  update(t, api) {
    const { S, C, placeBeads, flow } = api, P = S.PATH;
    const on = within(t, POWER), gas = within(t, GAS);
    const closeK = POWER.reduce((s, [a, b]) => s + outBack(prog(t, a, a + 0.18), 2) * (1 - prog(t, b, b + 0.15)), 0);
    S.armature.position.y = 1.0 - 0.75 * clamp(closeK, 0, 1.2);
    const key = on ? "I" : "O";
    if (S.contTex.key !== key) { S.contTex.key = key; const g = S.contTex.g; g.fillStyle = on ? C.gtint : C.idle; g.fillRect(0, 0, 200, 120); g.fillStyle = on ? C.green : C.muted; g.font = "700 80px 'JetBrains Mono'"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(key, 100, 66); S.contTex.tx.needsUpdate = true; }
    const openK = GAS.reduce((s, [a, b]) => s + prog(t, a, a + 0.15) * (1 - prog(t, b, b + 0.15)), 0);
    S.plunger.position.y = 4.6 + 0.45 * openK;
    const leakOn = t >= E.detect && t < T.end;
    S.valveRingMat.color.set(gas ? C.green : leakOn ? C.rust : C.idle);
    const wk = on ? "ON" : "OFF";
    if (S.wdTex.key !== wk) { S.wdTex.key = wk; const g = S.wdTex.g; g.fillStyle = on ? C.gtint : C.idle; g.fillRect(0, 0, 240, 100); g.fillStyle = on ? C.green : C.idlemark; g.font = "700 56px 'JetBrains Mono'"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(wk, 120, 54); S.wdTex.tx.needsUpdate = true; }
    // leak sensor light: green, orange pulse when it trips
    if (t >= E.detect - 0.3 && t < T.end) { S.leakMat.color.set(C.orange); S.leakMat.color.lerp(new api.THREE.Color(C.otint), 0.5 + 0.5 * Math.sin(t * 10)); }
    else S.leakMat.color.set(C.green);
    // the clamp clicks open and shut when it is introduced
    const clipAt = T.sys0;
    const clip = Math.sin(clamp(prog(t, clipAt - 0.6, clipAt + 0.5)) * Math.PI);
    S.ctHinge.position.set(0, 0, -2.0); S.ctB.position.set(0, 0, 2.0); S.ctHinge.rotation.y = 1.0 * clip;
    placeBeads(S.B.power, flow(t, POWER, 34, 22, [P.supplyIn, P.supplyOut]));
    placeBeads(S.B.gas, flow(t, GAS, 22, 16, [P.gasIn, P.gasOut]));
    const sig = [];
    if (within(t, [[E.contClose + 0.6, E.stop], [E.idleOn, E.autoOff]])) { const ph = t - Math.floor(t); if (ph < 0.7) sig.push({ curve: P.ctSig, u: ph / 0.7, s: 1 }); }
    // the leak sensor reports all the time, even with no session
    if (t >= T.steps[0] && t < T.end) { const ph = (t * 0.8) % 1; if (ph < 0.8) sig.push({ curve: P.leakSig, u: ph / 0.8, s: 1 }); }
    S.B.sig.material.color.set((t >= E.spike && t < E.stop) || t >= E.leak ? C.orange : C.green);
    placeBeads(S.B.sig, sig);
    const cmds = [];
    const cmd = (c, at) => { const k = prog(t, at - 0.55, at); if (k > 0 && k < 1) cmds.push({ curve: c, u: k, s: 1 }); };
    cmd(P.ctrlCont, E.contClose); cmd(P.ctrlValve, E.valveOpen); cmd(P.ctrlCont, E.stop + 0.02); cmd(P.ctrlValve, E.stop + 0.17);
    cmd(P.ctrlCont, E.idleOn); cmd(P.ctrlValve, E.idleOn + 0.3); cmd(P.ctrlCont, E.autoOff); cmd(P.ctrlValve, E.autoOff + 0.15);
    cmd(P.ctrlCont, E.p2on); cmd(P.ctrlValve, E.p2on + 0.3); cmd(P.ctrlValve, E.detect); cmd(P.ctrlCont, E.detect + 0.05);
    S.B.cmd.material.color.set((t > E.stop - 0.6 && t < E.stop + 0.4) || (t > E.detect - 0.6 && t < E.detect + 0.4) ? C.rust : C.green);
    placeBeads(S.B.cmd, cmds);
    // a faint cloud of escaping gas by the regulator while the leak lasts
    const cloud = [];
    const ck = clamp(prog(t, E.leak, E.leak + 0.6) * (1 - prog(t, T.end - 1.2, T.end)));
    if (ck > 0) for (let i = 0; i < 14; i++) {
      const ph = ((t * 0.35) + i / 14) % 1, a = rnd(i) * Math.PI * 2;
      cloud.push({ p: new api.THREE.Vector3(78 + Math.cos(a) * (2 + ph * 7), 84 + ph * 12, 7 + Math.sin(a) * (2 + ph * 6)), s: ck * (1 - ph) * (0.7 + rnd(i + 5) * 0.6) });
    }
    placeBeads(S.B.cloud, cloud);
  },
});
