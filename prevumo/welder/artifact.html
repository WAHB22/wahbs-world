<style>
  /* Layout: a 1920x1080 drawing sheet (the film frame) scaled to fit, with the controls and the parts list under it.
     Palette and type are PREVUMO's own (prevumo/src/index.css, deck "Field notes"); the page commits to the paper look. */
  :root {
    --bg: #F3EBDD; --surface: #FFFDF8; --border: #E3D6C0; --ink: #1F3D2B; --muted: #5B6B5F;
    --green: #2F6B45; --gtint: #D6E4D3; --orange: #E07A2E; --otint: #F6D2B4; --rust: #A63D1F; --idle: #EDE4D3; --idlemark: #81897A;
    --display: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif;
    --body: "Inter", ui-sans-serif, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: var(--body); -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #stage p, #stage h1, #stage ol { margin: 0; }

  /* ---------- the sheet ---------- */
  #frame { position: relative; width: 100%; max-width: 1600px; margin: 0 auto; aspect-ratio: 16 / 9; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg); overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  #sheet { position: absolute; inset: 26px; border: 2px solid var(--ink); border-radius: 4px; pointer-events: none; opacity: 0.85; }
  #sheet i { position: absolute; background: var(--ink); }
  #lines { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; overflow: visible; }
  .balloon { position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; font: 600 24px/1 var(--mono); color: var(--ink); pointer-events: none; }
  .balloon.ctx { border-color: var(--green); color: var(--green); }

  #head { position: absolute; left: 86px; top: 78px; pointer-events: none; max-width: 760px; }

  #bom .no { font: 600 21px/1.2 var(--mono); }

  .tag i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: block; }

  .btn.qd { color: var(--rust); box-shadow: inset 0 0 0 2px rgba(166, 61, 31, 0.4); }

  #detail .glass { background: var(--gtint); border-radius: 8px; padding: 14px 20px 16px; }
  #d1 { font: 700 42px/1.15 var(--mono); color: var(--ink); white-space: nowrap; }
  #d2 { margin-top: 6px; font: 500 28px/1.2 var(--mono); color: var(--muted); white-space: nowrap; }

  #tblock { position: absolute; right: 86px; bottom: 80px; width: 620px; border: 2px solid var(--ink); background: var(--surface); pointer-events: none; }
  #tblock .r { display: grid; grid-template-columns: 1fr 1fr; }
  #tblock .c { padding: 10px 14px; border-top: 1.5px solid var(--ink); }
  #tblock .c + .c { border-left: 1.5px solid var(--ink); }
  #tblock .r:first-child .c { border-top: 0; }
  #tblock .k { font: 500 15px/1 var(--mono); color: var(--muted); }
  #tblock .v { margin-top: 6px; font: 600 24px/1.15 var(--display); }
  #tblock .note { padding: 12px 14px; border-top: 1.5px solid var(--ink); font: 400 19px/1.35 var(--body); color: var(--ink); }

  .fade { will-change: opacity, transform; }

  /* ---------- page around the sheet ---------- */
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
  .film .wrap { padding: 0; }
  .film #frame { max-width: none; width: 1920px; height: 1080px; }
  .film #controls, .film #notes { display: none; }
  #controls { max-width: 1600px; margin: 14px auto 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #controls button { height: 40px; padding: 0 16px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); font: 500 15px/1 var(--body); cursor: pointer; }
  #controls button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  #controls button:focus-visible, #scrub:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  #controls .play { background: var(--green); border-color: var(--green); color: #fff; min-width: 92px; }
  #scrub { flex: 1 1 220px; min-width: 0; accent-color: var(--green); }
  #clock { font: 500 14px/1 var(--mono); color: var(--muted); min-width: 92px; text-align: right; }
  #hint { width: 100%; font: 400 14px/1.4 var(--body); color: var(--muted); }
  #notes { max-width: 1600px; margin: 28px auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 28px; }
  #notes h2 { margin: 0 0 10px; font: 700 26px/1.2 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
  #notes ol { margin: 0; padding: 0; list-style: none; }
  #notes li { display: grid; grid-template-columns: 40px 1fr; gap: 4px; padding: 10px 0; border-top: 1px solid var(--border); min-width: 0; }
  #notes li b { font: 600 16px/1.3 var(--display); }
  #notes li span { display: block; font: 400 14px/1.45 var(--body); color: var(--muted); }
  #notes li .n { font: 600 14px/1.5 var(--mono); color: var(--muted); }
  #notes li.hot .n, #notes li.hot b { color: var(--green); }
  #notes p { margin: 0; font: 400 15px/1.5 var(--body); color: var(--muted); max-width: 65ch; }
  @media (prefers-reduced-motion: reduce) { .fade { transition: none; } }

  /* shared additions (PD B3) */
  .tagx { position: absolute; padding: 9px 16px; border-radius: 8px; border: 2px solid var(--green); background: var(--surface); font: 600 24px/1.2 var(--display); color: var(--ink); white-space: nowrap; pointer-events: none; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 8px; }
  .tagx.ok { background: var(--gtint); }
  .tagx.warn { background: var(--otint); border-color: var(--orange); }
  .tagx.bad { background: var(--rust); border-color: var(--rust); color: #fff; }
  .tagx svg { width: 22px; height: 22px; flex: none; }
  #chart .tag.warm { border-color: var(--gtint); background: var(--gtint); color: var(--ink); }
  #chart .tag.hot { border-color: var(--otint); background: var(--otint); color: var(--ink); }
  .badge.safety { background: var(--rust); color: #fff; }
  .badge.safety i { background: #fff; }
  .badge.paused { background: var(--otint); }
  .badge.info { background: var(--gtint); }
  .badge.info i { background: var(--green); }
  .xcard { right: 86px; width: 560px; padding: 20px 24px 18px; }
  .xcard .tt { font: 600 27px/1.2 var(--display); letter-spacing: -0.01em; }
  .xcard .lbl { font: 500 18px/1 var(--mono); color: var(--muted); }
  .xcard .rows { margin-top: 12px; display: grid; gap: 0; }
  .xcard .r { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 9px 0; border-top: 1.5px solid var(--border); font: 400 21px/1.3 var(--body); }
  .xcard .r b { font: 600 21px/1.3 var(--body); }
  .xcard .k { color: var(--muted); }
  .xcard .chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; font: 600 19px/1 var(--body); margin-top: 12px; }
  .xcard .chip.warn { background: var(--otint); color: var(--ink); }
  .xcard .chip.ok { background: var(--gtint); color: var(--ink); }
  .xcard .chip.bad { background: var(--rust); color: #fff; }
  .xcard .foot { margin-top: 10px; font: 400 16px/1 var(--mono); color: var(--muted); }
  .xcard .mrow { display: grid; grid-template-columns: 112px 1fr 92px; gap: 14px; align-items: center; padding: 10px 0; border-top: 1.5px solid var(--border); }
  .xcard .mrow .mn { font: 600 22px/1.1 var(--display); }
  .xcard .mrow .use { font: 600 17px/1 var(--body); color: var(--green); text-align: right; }
  .xcard .mrow.on .mn { color: var(--green); }
  .xcard .mrow svg { display: block; width: 100%; height: 52px; }
  #concept { position: absolute; left: 78px; bottom: 34px; padding: 6px 8px; background: var(--bg); font: 500 17px/1 var(--mono); color: var(--muted); pointer-events: none; }
  #notes .ev li { grid-template-columns: 1fr; }
  #notes .ev a { color: var(--green); }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }</script>
<script type="module">
// PREVUMO drawing-sheet engine (PD B3). One three.js "drawing sheet" shared by every machine page:
// the box (NFC reader, QR sticker, display), the exploded view, balloons, parts table, steps, charts,
// owner app alerts, session cards and the title block. Each page passes a config to run().
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
import { Line2 } from "three/addons/lines/Line2.js";
import { LineGeometry } from "three/addons/lines/LineGeometry.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";

const C = {
  bg: "#F3EBDD", surface: "#FFFDF8", border: "#E3D6C0", ink: "#1F3D2B", inkDeep: "#16301F", inkSoft: "#2C4D39", muted: "#5B6B5F",
  green: "#2F6B45", gtint: "#D6E4D3", orange: "#E07A2E", otint: "#F6D2B4", rust: "#A63D1F", idle: "#EDE4D3", idlemark: "#81897A",
};
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const outCubic = (k) => 1 - Math.pow(1 - k, 3);
const outBack = (k, s = 1.25) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const rnd = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const within = (t, spans) => spans.some(([a, b]) => t >= a && t < b);
const spanK = (t, spans, fin = 0.35, fout = 0.3) => clamp(spans.reduce((s, [a, b]) => s + prog(t, a, a + fin) * (1 - prog(t, b, b + fout)), 0));
const seq = (t, list) => { let v = list[0][1]; for (const [a, x] of list) if (t >= a) v = x; return typeof v === "function" ? v(t) : v; };
const U = { clamp, prog, lerp, ease, outCubic, outBack, rnd, within, spanK, seq };

const TITLE_NOTE = "Concept only, not built or tested. A licensed electrician installs switching parts; gas parts reviewed by a licensed gas fitter; CSA certification needed before sale.";

// The shared timeline: title, explode with box balloons, reassemble, the machine with its off-box parts, then the steps.
function plan(nBox, nSys, stepDur) {
  const T = { explode: 3.6, bom0: 6.0, bomStep: 1.1 };
  T.assemble = T.bom0 + nBox * T.bomStep + 0.5;
  T.sysIn = T.assemble + 1.5;
  T.sys0 = T.assemble + 2.7;
  T.sysStep = 0.85;
  T.how = T.sys0 + Math.max(1, nSys) * T.sysStep + 1.1;
  T.steps = [T.how + 0.5];
  for (const d of stepDur) T.steps.push(T.steps[T.steps.length - 1] + d);
  T.end = T.steps[T.steps.length - 1] + 0.2;
  T.explode2 = T.end + 0.4;
  T.dur = +(T.explode2 + 5.2).toFixed(2);
  return T;
}

const W = 1920, H = 1080;
const ICON = {
  power: '<svg viewBox="0 0 24 24"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>',
  wrench: '<svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>',
  flag: '<svg viewBox="0 0 24 24"><path d="M5 21V4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M5.5 4h12l-3 4.5 3 4.5h-12z" fill="currentColor"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z" fill="currentColor"/><path d="M12 10v5M12 18h.01" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg>',
};
const BTN = {
  off: (r) => `<div class="btn qd">${ICON.power}Shut down${r}</div>`,
  tech: (r) => `<div class="btn pr">${ICON.wrench}Call technician${r}</div>`,
  ok: (r) => `<div class="btn sec">${ICON.shield}Mark as OK${r}</div>`,
  cancel: (r) => `<div class="btn sec">Cancel${r}</div>`,
  confirm: (r) => `<div class="btn dg">${ICON.power}Shut down${r}</div>`,
  gap: () => `<span style="flex:1"></span>`,
};

function run(cfg) {
  const FILM = new URLSearchParams(location.search).has("film");
  if (FILM) document.documentElement.classList.add("film");
  const T = cfg.T, DUR = T.dur;
  const $ = (s) => document.querySelector(s);

  // ---------------- page ----------------
  const chapters = [["b-assembled", "Assembled"], ["b-pieces", "In pieces"], ["b-system", cfg.sysTitle], ["b-how", "How it works"], ...(cfg.chapters || []).map((c, i) => [`b-x${i}`, c.label])];
  document.body.insertAdjacentHTML("beforeend", `
<div class="wrap">
  <div id="frame"><div id="stage">
    <canvas id="gl" aria-label="3D drawing of the PREVUMO ${cfg.name.toLowerCase()}. Drag to turn it."></canvas>
    <svg id="lines" viewBox="0 0 1920 1080"></svg>
    <div id="balloons"></div><div id="tags"></div><div id="sheet"></div>
    <header id="head" class="fade"><p id="kick" class="mono"></p><div class="mask"><h1 id="ttl"></h1></div><p id="sub">${cfg.sub}</p></header>
    <aside id="bom" class="fade"><div class="hd"><span>No.</span><span>Part</span></div></aside>
    <ol id="steps" class="fade"></ol>
    <section id="chart" class="card fade"><div class="top"><p class="tt" id="charttt"></p><span class="tag" id="charttag"></span></div><svg id="chartsvg" width="508" height="210" viewBox="0 0 508 210"></svg></section>
    <section id="detail" class="card fade"><p class="dl">Detail A · display on the box</p><div class="scr"><i id="dlight"></i><div class="glass"><p id="d1"></p><p id="d2"></p></div></div></section>
    <div id="cards"></div>
    <p id="applabel" class="fade">Owner app · illustrative</p>
    <section id="alert" class="card fade"><div class="ah"><span class="badge" id="abadge"></span><p class="at" id="atitle"></p><p class="ar" id="areason"></p></div><div class="af" id="afoot"></div></section>
    <footer id="tblock" class="fade">
      <div class="r"><div class="c"><p class="k">Project</p><p class="v">PREVUMO</p></div><div class="c"><p class="k">Drawing</p><p class="v">${cfg.name}</p></div></div>
      <div class="r"><div class="c"><p class="k">Revision</p><p class="v">Concept v0.2 · PD B3</p></div><div class="c"><p class="k">Team</p><p class="v">Group 10 · GNG4120</p></div></div>
      <div class="r"><div class="c"><p class="k">Date</p><p class="v">Nov 2026</p></div><div class="c"><p class="k">Scale</p><p class="v">Not to scale</p></div></div>
      <p class="note">${TITLE_NOTE}</p>
    </footer>
    <p id="concept">Concept drawing · not built or tested · charts, numbers and alerts are illustrative</p>
  </div></div>
  <div id="controls">
    ${chapters.map(([id, l]) => `<button type="button" id="${id}">${l}</button>`).join("")}
    <button type="button" id="b-play" class="play">Play</button>

    for (const s of [-1, 1]) spool.add(cm(CYL(5.8, 0.5, 36), C.ink, { p: [s * 2.45, 8.2, 0], r: [0, 0, Math.PI / 2] }));
    tube(curve([[40, 43.4, 9.6], [40, 41.2, 11.6], [40, 40.2, 13.5]]), 0.22, C.idlemark, { outline: false, seg: 20 });
    // torch on its lead
    const torchPath = curve([[40, 12.5, 46.6], [39, 8, 52], [32, 2.2, 58], [20, 2.2, 61], [12, 3, 60]]);
    tube(torchPath, 0.8, C.ink, { seg: 60 });
    const torch = new THREE.Group(); torch.position.set(12, 3, 60); torch.rotation.y = 0.25; ctx.add(torch);
    torch.add(cm(new THREE.CapsuleGeometry(1.4, 6, 6, 16), C.ink, { r: [0, 0, Math.PI / 2], p: [-3.6, 0, 0] }));
    torch.add(cm(CYL(0.9, 4, 16), C.idlemark, { r: [0, 0, Math.PI / 2 - 0.5], p: [-9.2, -1.1, 0] }));
    // shielding gas cylinder and regulator
    const cyl = new THREE.Group(); cyl.position.set(80, 0, 9); ctx.add(cyl); S.cyl = cyl;
    const prof = [[0, 0], [9.6, 0], [10, 0.6], [10, 62], [9.4, 66], [7.4, 69.2], [4.2, 71.2], [2.4, 72], [2.4, 77.5], [0, 77.5]].map(([x, y]) => new THREE.Vector2(x, y));
    cyl.add(cm(new THREE.LatheGeometry(prof, 40), C.gtint));
    cyl.add(cm(new THREE.CylinderGeometry(10.05, 10.05, 7, 40, 1, true), C.surface, { p: [0, 47, 0], outline: false }));
    cyl.add(cm(new THREE.TorusGeometry(2.4, 0.45, 10, 24), C.ink, { p: [0, 76.6, 0], r: [Math.PI / 2, 0, 0] }));
    cyl.add(cm(RB(4.4, 4.4, 4.4, 0.6), C.surface, { p: [0, 81, 0] }));
    cyl.add(cm(CYL(2.3, 0.9), C.surface, { p: [0, 83.6, 2.6], r: [Math.PI / 2, 0, 0] }));
    const gaugeTex = canvasTex(200, 200);
    { const g = gaugeTex.g; g.fillStyle = C.surface; g.beginPath(); g.arc(100, 100, 96, 0, 7); g.fill(); g.strokeStyle = C.ink; g.lineWidth = 5;
      for (let i = 0; i <= 10; i++) { const a = Math.PI * (0.75 + i * 0.15); g.beginPath(); g.moveTo(100 + Math.cos(a) * 70, 100 + Math.sin(a) * 70); g.lineTo(100 + Math.cos(a) * 86, 100 + Math.sin(a) * 86); g.stroke(); }
      g.strokeStyle = C.rust; g.lineWidth = 7; g.beginPath(); g.moveTo(100, 100); g.lineTo(100 + Math.cos(Math.PI * 1.6) * 64, 100 + Math.sin(Math.PI * 1.6) * 64); g.stroke(); gaugeTex.tx.needsUpdate = true; }
    const gauge = texPlane(4.2, 4.2, gaugeTex, true); gauge.position.set(0, 83.6, 3.08); cyl.add(gauge);
    cyl.add(cm(CYL(0.55, 2.2, 12), C.muted, { p: [-3.2, 80.4, 0], r: [0, 0, Math.PI / 2] }));
    // soft footprints
    for (const [x, z, sx, sz] of [[40, 22, 17, 27], [80, 9, 12.5, 12.5]]) {
      const m = new THREE.MeshBasicMaterial({ color: C.border, transparent: true }); api.ctxMats.push(m);
      const f = new THREE.Mesh(new THREE.CircleGeometry(1, 48), m); f.rotation.x = -Math.PI / 2; f.position.set(x, 0.05, z); f.scale.set(sx, sz, 1); ctx.add(f);
    }
    // cables, hose and signal wires (the four glands, left to right: clamp, contactor, valve, leak sensor)
    S.PATH = {
      supplyIn: curve([[-26, 113, 0.4], [-26, 109, 1.6], [-26, 105.2, 1.8]]),
      supplyOut: curve([[-26, 96.2, 1.8], [-26, 89, 1.8], [-26, 80, 2.4], [-24, 62, 2.6], [-10, 38, 0.8], [12, 28, -1.6], [27, 26.5, -1.8], [34, 26.5, -1.2]]),
      ctSig: curve([[-24.2, 89, 1.8], [-17, 87.2, -1.6], [-8, 86, -2.0], [-4.5, 86.8, -1.4], [-4.5, 89.2, -0.8]]),
      ctrlCont: curve([[-1.5, 89.2, -0.8], [-1.5, 85.6, -2.0], [-9, 84.4, -2.3], [-19, 88, -2.2], [-22.6, 95, 0.3], [-23.2, 99, 1.0]]),
      ctrlValve: curve([[1.5, 89.2, -0.8], [1.5, 85.4, -2.1], [16, 83.6, -2.4], [42, 80.6, -2.4], [52, 77.8, -1.7], [55.2, 76.2, -0.2]]),
      leakSig: curve([[65.6, 91, -2.4], [58, 90.2, -2.6], [30, 88.8, -2.6], [8, 87.2, -2.4], [4.5, 87.4, -1.6], [4.5, 89.2, -0.8]]),
      gasIn: curve([[76.8, 80.4, 9], [70, 80.6, 7.8], [63, 77, 3.4], [58.8, 74, 0]]),
      gasOut: curve([[53.2, 74, 0], [50.4, 68, -1.6], [47.6, 48, -2.4], [46.2, 34, -1.8], [46, 30, -1.1]]),
    };
    const P = S.PATH;
    tube(P.supplyIn, 0.75, C.ink, { seg: 30 }); tube(P.supplyOut, 0.75, C.ink, { seg: 160 });
    tube(P.gasIn, 0.55, C.muted, { seg: 60 }); tube(P.gasOut, 0.55, C.muted, { seg: 80 });
    for (const k of ["ctSig", "ctrlCont", "ctrlValve", "leakSig"]) tube(P[k], 0.26, C.idlemark, { outline: false, seg: 120 });
    // current clamp around one supply wire, in two hinged halves
    const ct = new THREE.Group(); ct.position.set(-26, 89, 1.8); ctx.add(ct); S.ct = ct;
    const ringProf = [[1.0, -0.9], [2.0, -0.9], [2.0, 0.9], [1.0, 0.9], [1.0, -0.9]].map(([x, y]) => new THREE.Vector2(x, y));
    ct.add(cm(new THREE.LatheGeometry(ringProf, 24, 0, Math.PI), C.ink));
    S.ctHinge = new THREE.Group(); ct.add(S.ctHinge);
    S.ctB = cm(new THREE.LatheGeometry(ringProf, 24, Math.PI, Math.PI), C.ink); S.ctHinge.add(S.ctB);
    ct.add(cm(RB(1.2, 1.4, 1.6, 0.3), C.idlemark, { p: [1.9, 0, 0] }));
    // flow beads
    S.B = { power: beads(22, 0.95, C.green), gas: beads(16, 0.78, C.surface), sig: beads(6, 0.55, C.gtint), cmd: beads(6, 0.75, C.green), cloud: beads(14, 0.9, C.otint) };
    return S;
  },

  update(t, api) {
    const { S, C, placeBeads, flow } = api, P = S.PATH;
    const on = within(t, POWER), gas = within(t, GAS);
    const closeK = POWER.reduce((s, [a, b]) => s + outBack(prog(t, a, a + 0.18), 2) * (1 - prog(t, b, b + 0.15)), 0);
    S.armature.position.y = 1.0 - 0.75 * clamp(closeK, 0, 1.2);
    const key = on ? "I" : "O";
    if (S.contTex.key !== key) { S.contTex.key = key; const g = S.contTex.g; g.fillStyle = on ? C.gtint : C.idle; g.fillRect(0, 0, 200, 120); g.fillStyle = on ? C.green : C.muted; g.font = "700 80px 'JetBrains Mono'"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(key, 100, 66); S.contTex.tx.needsUpdate = true; }
    const openK = GAS.reduce((s, [a, b]) => s + prog(t, a, a + 0.15) * (1 - prog(t, b, b + 0.15)), 0);
    S.plunger.position.y = 4.6 + 0.45 * openK;
    const leakOn = t >= E.detect && t < T.end;
    S.valveRingMat.color.set(gas ? C.green : leakOn ? C.rust : C.idle);
    const wk = on ? "ON" : "OFF";
    if (S.wdTex.key !== wk) { S.wdTex.key = wk; const g = S.wdTex.g; g.fillStyle = on ? C.gtint : C.idle; g.fillRect(0, 0, 240, 100); g.fillStyle = on ? C.green : C.idlemark; g.font = "700 56px 'JetBrains Mono'"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(wk, 120, 54); S.wdTex.tx.needsUpdate = true; }
    // leak sensor light: green, orange pulse when it trips
    if (t >= E.detect - 0.3 && t < T.end) { S.leakMat.color.set(C.orange); S.leakMat.color.lerp(new api.THREE.Color(C.otint), 0.5 + 0.5 * Math.sin(t * 10)); }
    else S.leakMat.color.set(C.green);
    // the clamp clicks open and shut when it is introduced
    const clipAt = T.sys0;
    const clip = Math.sin(clamp(prog(t, clipAt - 0.6, clipAt + 0.5)) * Math.PI);
    S.ctHinge.position.set(0, 0, -2.0); S.ctB.position.set(0, 0, 2.0); S.ctHinge.rotation.y = 1.0 * clip;
    placeBeads(S.B.power, flow(t, POWER, 34, 22, [P.supplyIn, P.supplyOut]));
    placeBeads(S.B.gas, flow(t, GAS, 22, 16, [P.gasIn, P.gasOut]));
    const sig = [];
    if (within(t, [[E.contClose + 0.6, E.stop], [E.idleOn, E.autoOff]])) { const ph = t - Math.floor(t); if (ph < 0.7) sig.push({ curve: P.ctSig, u: ph / 0.7, s: 1 }); }
    // the leak sensor reports all the time, even with no session
    if (t >= T.steps[0] && t < T.end) { const ph = (t * 0.8) % 1; if (ph < 0.8) sig.push({ curve: P.leakSig, u: ph / 0.8, s: 1 }); }
    S.B.sig.material.color.set((t >= E.spike && t < E.stop) || t >= E.leak ? C.orange : C.green);
    placeBeads(S.B.sig, sig);
    const cmds = [];
    const cmd = (c, at) => { const k = prog(t, at - 0.55, at); if (k > 0 && k < 1) cmds.push({ curve: c, u: k, s: 1 }); };
    cmd(P.ctrlCont, E.contClose); cmd(P.ctrlValve, E.valveOpen); cmd(P.ctrlCont, E.stop + 0.02); cmd(P.ctrlValve, E.stop + 0.17);
    cmd(P.ctrlCont, E.idleOn); cmd(P.ctrlValve, E.idleOn + 0.3); cmd(P.ctrlCont, E.autoOff); cmd(P.ctrlValve, E.autoOff + 0.15);
    cmd(P.ctrlCont, E.p2on); cmd(P.ctrlValve, E.p2on + 0.3); cmd(P.ctrlValve, E.detect); cmd(P.ctrlCont, E.detect + 0.05);
    S.B.cmd.material.color.set((t > E.stop - 0.6 && t < E.stop + 0.4) || (t > E.detect - 0.6 && t < E.detect + 0.4) ? C.rust : C.green);
    placeBeads(S.B.cmd, cmds);
    // a faint cloud of escaping gas by the regulator while the leak lasts
    const cloud = [];
    const ck = clamp(prog(t, E.leak, E.leak + 0.6) * (1 - prog(t, T.end - 1.2, T.end)));
    if (ck > 0) for (let i = 0; i < 14; i++) {
      const ph = ((t * 0.35) + i / 14) % 1, a = rnd(i) * Math.PI * 2;
      cloud.push({ p: new api.THREE.Vector3(78 + Math.cos(a) * (2 + ph * 7), 84 + ph * 12, 7 + Math.sin(a) * (2 + ph * 6)), s: ck * (1 - ph) * (0.7 + rnd(i + 5) * 0.6) });
    }
    placeBeads(S.B.cloud, cloud);
  },
});
