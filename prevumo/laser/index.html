  priya: s0 + 0.8, lucas: s0 + 3.2,
  fanOn: s1 + 2.0, airOn: s2 + 1.6, cut1: s3 + 0.3,
  flame: s4 + 0.8, flameSeen: s4 + 1.2, alertA: s4 + 1.6, tapOk: s4 + 4.2, loggedA: s4 + 4.7, resume: s5 + 0.2,
  tapOut: s5 + 1.2, alertB: s5 + 1.6, tapOff: s5 + 3.6, loggedB: s5 + 4.1,
  amira: s6 + 0.3, cut3: s6 + 0.8, warm: s6 + 1.4, coolStop: s6 + 2.8, alertC: s6 + 3.2, tapTech: s6 + 5.0, loggedC: s6 + 5.4,
  jonah: s7 + 0.3, ready: s7 + 0.8, countdown: s7 + 1.6, autoOff: s7 + 3.6,

const ENABLE = [[E.airOn + 0.2, E.flameSeen], [E.loggedA + 0.3, E.tapOut], [E.cut3 - 0.3, E.coolStop], [E.ready, E.autoOff]];
const LASING = [[E.cut1, E.flameSeen], [E.resume, E.tapOut], [E.cut3, E.coolStop]];
const lasing = (t) => within(t, LASING);
const fanRunning = (t) => t >= E.fanOn && t < T.end;
const airRunning = (t) => t >= E.airOn && t < T.end;
const MIN1 = (t) => Math.round(14 * clamp((Math.min(t, E.flameSeen) - E.cut1) / (E.flameSeen - E.cut1)) * 0.8 + (t >= E.resume ? 14 * 0.2 * clamp((t - E.resume) / (E.tapOut - E.resume)) : 0));
const MIN3 = (t) => Math.round(6 * clamp((t - E.cut3) / (E.coolStop - E.cut3)));

// illustrative coolant temperature
const coolant = (tt) => {
  const base = 0.4 + (rnd(Math.floor(tt * 10) + 6) - 0.5) * 0.03;
  const work = lasing(tt) ? 0.06 : 0;
  if (tt < E.warm) return base + work;
  if (tt < E.coolStop + 0.2) return base + work + 0.44 * ease(prog(tt, E.warm, E.coolStop));
  return base + 0.44 - 0.2 * prog(tt, E.coolStop, E.coolStop + 3);
};
const idleI = (tt) => (tt >= E.ready && tt < E.autoOff ? 0.12 + (rnd(Math.floor(tt * 10)) - 0.5) * 0.03 : 0);

const chip = (ok, a, b) => `<span class="chip ${ok ? "ok" : "bad"}" style="margin-top:0">${ok ? a : b}</span>`;

  about: "The laser cutter module sits on the wall beside a CO2 laser with its exhaust fan, water chiller and air assist. The box does not switch the laser's mains: an interlock relay opens the laser's enable line, so the laser can only fire for a trained member, with the exhaust drawing current, air pressure on the head and the coolant in range. A flame in the bed or the member tapping out mid-job pauses the laser and alerts the owner; laser-on minutes are logged per member.",
