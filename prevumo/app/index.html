<style>

  .tbl th { text-align: left; font: 500 13px/1.2 var(--mono); color: var(--muted); padding: 14px 14px 10px; border-bottom: 2px solid var(--border); white-space: nowrap; }

  .tbl td.num { font: 500 15px/1.4 var(--mono); white-space: nowrap; }
  .tbl .nm { font: 600 17px/1.3 var(--display); }
  details { margin-top: 6px; }
  summary { cursor: pointer; font: 500 14px/1.4 var(--body); color: var(--green); min-height: 32px; display: inline-flex; align-items: center; }
  .sess { margin: 6px 0 0; padding: 0; list-style: none; font: 400 14px/1.5 var(--body); color: var(--muted); }
  .sess li { padding: 3px 0; }
  .bars { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; }
  .bar { display: grid; grid-template-columns: 120px 1fr 92px; gap: 10px; align-items: center; padding: 8px 0; font-size: 15px; }
  .bar .track { height: 14px; border-radius: 7px; background: var(--idle); overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 7px; background: var(--green); }
  .bar .v { font: 500 14px/1 var(--mono); text-align: right; }
  .big { font: 700 32px/1.1 var(--display); letter-spacing: -0.02em; margin: 6px 0 0; }
  .lbl { font: 500 13px/1.3 var(--mono); color: var(--muted); }
  .man { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; }
  .qr { width: 64px; height: 64px; border-radius: 10px; background: var(--surface); border: 2px solid var(--border); display: block; }
  .man h3 { margin: 0; font: 700 19px/1.2 var(--display); }
  .man p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
  a.btn { text-decoration: none; }
  .reset { margin-top: 26px; }
  .confirm { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .confirm p { margin: 0 0 4px; width: 100%; font-weight: 600; }
  @media (max-width: 899px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; top: auto; height: auto; flex-direction: row; gap: 0; padding: 6px max(6px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); border-right: 0; border-top: 2px solid var(--border); background: var(--bg); }
    .brand, .side-foot { display: none; }
    .tab { flex: 1; flex-direction: column; justify-content: center; gap: 3px; min-height: 58px; padding: 4px 2px; font-size: 11.5px; position: relative; text-align: center; }
    .tab .count { position: absolute; top: 4px; left: calc(50% + 6px); margin: 0; min-width: 20px; height: 20px; font-size: 11px; line-height: 20px; padding: 0 5px; }
    main { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 110px max(16px, env(safe-area-inset-left, 0px)); }
    h1 { font-size: 28px; }
    .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
    .tbl { border: 0; background: none; }
    .tbl thead { display: none; }
    .tbl tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 12px; background: var(--surface); border: 2px solid var(--border); border-radius: 18px; padding: 10px 14px; margin-bottom: 12px; }
    .tbl td:first-child { grid-column: 1 / -1; }
    .tbl td { border: 0; padding: 5px 0; }
    .tbl td[data-k]::before { content: attr(data-k); display: block; font: 500 12px/1.3 var(--mono); color: var(--muted); }
    .bar { grid-template-columns: 96px 1fr 80px; }
    .man { grid-template-columns: 52px 1fr; }
    .man .btn { grid-column: 1 / -1; justify-content: center; }
    .qr { width: 52px; height: 52px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script>
const MANUAL = "https://claude.ai/artifact/H3puTqjPPLrXovR8i2b6jk";
const NOW = "14:32";
const IC = {
  power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>',
  wrench: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.1-3.1c.32-.32.86-.22.98.22a6 6 0 0 1-8.26 7.06l-7.91 7.91a1 1 0 0 1-3-3l7.91-7.91a6 6 0 0 1 7.06-8.26c.44.12.54.66.22.98z"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>',
  flag: '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 21V4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M5.5 4h12l-3 4.5 3 4.5h-12z" fill="currentColor"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 1 2-2h13"/></svg>',
};
// ---------------- demo data ----------------
const MACHINES = [
  { id: "welder-2", name: "Welder 2", kind: "MIG welder", status: "alert", who: null, last: "Priya Nair, stopped 14:05", chart: "leak", cap: "gas leak sensor · valve closed", facts: [["Wire today", "86 g"], ["Gas valve open today", "1 h 10 min"]] },
  { id: "printer-4", name: "3D printer 4", kind: "FDM printer", status: "use", who: ["Lucas Tremblay", "printing, 0:48"], chart: "print", cap: "current · normal range", facts: [["Filament this session", "9 g"], ["Est. left", "1 h 05 min"]], alert: "printer-irr" },
  { id: "laser-1", name: "Laser 1", kind: "CO2 laser cutter", status: "idle", who: null, last: "Amira Haddad, 11:20", chart: "idle", cap: "enabled line open · idle", facts: [["Laser on today", "18 min"], ["Coolant", "18 °C"]] },
  { id: "multimaker-1", name: "Multimaker 1", kind: "3-in-1: print, laser, CNC", status: "learn", who: ["Jonah Okafor", "CNC, 0:12"], chart: "cnc", cap: "learning mode · day 9 of 14, recording only", facts: [["Spindle today", "12 min"], ["Auto shutdown", "off while learning"]] },
];
const STATUS = { use: ["In use", "s-use"], idle: ["Idle", "s-idle"], alert: ["Alert", "s-alert"], learn: ["Learning mode", "s-learn"] };
const ALERTS = [
  { id: "welder-leak", machine: "welder-2", tone: "safety", badge: "Safety · stopped first", title: "Gas leak near Welder 2", reason: "Valve closed automatically. Welder power is off too. Priya Nair was on.", time: "14:05" },
  { id: "printer-irr", machine: "printer-4", tone: "irr", badge: "Irregular pattern", title: "3D printer 4 · current stays high", reason: "Current is above its normal range after the warm-up. In use by Lucas Tremblay.", time: "14:29" },
];
const EARLIER = [
  ["Laser 1 · coolant too warm", "Laser stopped before the tube overheated. Amira Haddad.", "11:20", "Call technician", "rust"],
  ["3D printer 4 · failed print?", "Job paused: the spool stopped losing weight. Priya Nair.", "09:55", "Shut down", ""],
  ["Laser 1 · flame in the bed", "Laser paused; a small flare-up, put out. Lucas Tremblay.", "09:12", "Mark as OK", "ok"],
];
const MEMBERS = [
  { name: "Amira Haddad", sessions: 9, min: 412, wire: 312, fil: 0, laser: 64, spindle: 0, flag: "Review: 3x usual wire on Welder 2", log: ["Nov 9 · Welder 2 · 18 min · 42 g wire (about 14 g usual)", "Nov 9 · Laser 1 · 6 min laser on · coolant stop", "Nov 7 · Laser 1 · 22 min laser on"] },
  { name: "Priya Nair", sessions: 11, min: 538, wire: 120, fil: 214, laser: 0, spindle: 96, flag: null, log: ["Nov 10 · Welder 2 · 32 min · 44 g wire · gas leak stop", "Nov 10 · 3D printer 4 · 1 h 40 min · 18 g · failed print", "Nov 8 · Multimaker 1 · CNC · 42 min spindle"] },
  { name: "Jonah Okafor", sessions: 6, min: 301, wire: 0, fil: 168, laser: 12, spindle: 24, flag: null, log: ["Nov 10 · Multimaker 1 · CNC · 12 min so far", "Nov 8 · 3D printer 2 · 2 h 10 min · 24 g · failed print", "Nov 6 · Laser 1 · 12 min laser on"] },
  { name: "Lucas Tremblay", sessions: 8, min: 466, wire: 0, fil: 236, laser: 58, spindle: 0, flag: null, log: ["Nov 10 · 3D printer 4 · 0:48 so far · 9 g", "Nov 10 · Laser 1 · 14 min laser on · tapped out mid-job", "Nov 9 · Multimaker 1 · print · 12 g"] },
];
// ---------------- state (decisions stay on this device) ----------------
let state = { decisions: {}, confirm: null };
try { const s = JSON.parse(localStorage.getItem("prevumo-owner-demo") || "null"); if (s && s.decisions) state.decisions = s.decisions; } catch (e) {}
const save = () => { try { localStorage.setItem("prevumo-owner-demo", JSON.stringify({ decisions: state.decisions })); } catch (e) {} };
const machineStatus = (m) => {
  if (m.id === "welder-2") { const d = state.decisions["welder-leak"]; if (!d) return ["alert", null]; return ["idle", d === "Mark as OK" ? "cleared by owner" : d === "Call technician" ? "locked until a technician checks it" : "kept off by owner"]; }
  if (m.id === "printer-4") { const d = state.decisions["printer-irr"]; if (d === "Shut down") return ["idle", "shut down by owner"]; return ["use", null]; }
  return [m.status, null];
};
const openAlerts = () => ALERTS.filter((a) => !state.decisions[a.id]);
// ---------------- live mini charts ----------------
const rnd = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const SERIES = {
  print: (k) => 0.48 + 0.1 * Math.tanh(3 * Math.sin(k * 0.65)) + (rnd(k) - 0.5) * 0.08,
  cnc: (k) => 0.5 + (rnd(k + 3) - 0.5) * 0.22 + 0.05 * Math.sin(k * 0.31),
  idle: () => 0.16,
  leak: (k) => 0.62 + (rnd(k + 9) - 0.5) * 0.05,
};
const BAND = { print: [0.32, 0.7], cnc: null, idle: null, leak: null };
let tick = 0;
function spark(m) {
  const [st] = machineStatus(m);
  const kind = m.id === "printer-4" && st === "idle" ? "idle" : m.chart;
  const n = 48, w = 300, h = 74;
  const pts = []; for (let i = 0; i < n; i++) { const v = SERIES[kind](tick + i); pts.push(`${(i / (n - 1) * w).toFixed(1)},${(h - 18 - v * (h - 26)).toFixed(1)}`); }
  const col = kind === "leak" ? "#A63D1F" : kind === "idle" ? "#81897A" : "#2F6B45";
  const band = BAND[kind] ? `<rect x="0" y="${h - 18 - BAND[kind][1] * (h - 26)}" width="${w}" height="${(BAND[kind][1] - BAND[kind][0]) * (h - 26)}" fill="#D6E4D3"/>` : "";
  const guide = kind === "leak" ? `<line x1="0" x2="${w}" y1="${h - 18 - 0.5 * (h - 26)}" y2="${h - 18 - 0.5 * (h - 26)}" stroke="#A63D1F" stroke-width="1.5" stroke-dasharray="6 5"/>` : "";
  const last = pts[pts.length - 1].split(",");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${band}${guide}<polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${col}"/></svg>`;
}
// ---------------- views ----------------
let view = "machines";
const head = (t, s) => `<div class="top"><div><h1>${t}</h1><p class="sub">${s}</p></div><span class="demo"><i></i>Demo data · illustrative</span></div>`;
const V = {
  machines: () => `${head("Machines", "Makerspace (demo) · Monday, live")}
    <div class="grid">${MACHINES.map((m) => {
      const [st, why] = machineStatus(m); const [lab, cls] = STATUS[st];
      const alertOpen = m.alert && !state.decisions[m.alert];
      const who = st === "alert" ? `<p class="who">Nobody on <span>· last: ${m.last}</span></p>` : m.who && st !== "idle" ? `<p class="who">${m.who[0]} <span>· ${m.who[1]}</span></p>` : `<p class="who">Nobody on <span>· ${why || "last: " + m.last}</span></p>`;
      return `<article class="card mc"><div class="row1"><div><h2>${m.name}</h2><span class="lbl">${m.kind}</span></div><span class="pill ${cls}"><i></i>${lab}</span></div>
        ${who}<div class="spark" data-m="${m.id}">${spark(m)}<span class="cap">${st === "idle" && m.id === "printer-4" ? "power off" : m.cap}</span></div>
        <p class="facts">${m.facts.map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join("")}</p>
        ${st === "alert" || alertOpen ? `<button class="chip warn" data-go="alerts" style="margin-top:12px">${IC.flag}${st === "alert" ? "Open alert: decide what happens" : "1 open alert"}</button>` : ""}</article>`;
    }).join("")}</div>
    <p class="note">Charts are illustrative and update once a second. Learning mode: the first two weeks only record the normal range, with no automatic shutdown.</p>`,
  alerts: () => {
    const open = openAlerts();
    const decided = ALERTS.filter((a) => state.decisions[a.id]);
    return `${head("Alerts", "One format for every machine: Shut down, Call technician or Mark as OK")}
    <div class="alerts">${open.length ? open.map((a) => `<article class="card al"><div class="ah"><span class="badge ${a.tone === "safety" ? "safety" : ""}"><i></i>${a.badge}</span><h3>${a.title}</h3><p>${a.reason}</p><p class="meta">Today ${a.time}${a.tone === "safety" ? " · the machine stopped itself first" : ""}</p></div>
      <div class="af">${state.confirm === a.id ? `<div class="confirm"><p>Shut down ${MACHINES.find((m) => m.id === a.machine).name}? It won't restart on its own.</p><button class="btn sec" data-cancel="${a.id}">Cancel</button><span class="spacer"></span><button class="btn dg" data-do="${a.id}" data-d="Shut down">${IC.power}Shut down</button></div>`
        : `<button class="btn qd" data-ask="${a.id}">${IC.power}Shut down</button><button class="btn pr" data-do="${a.id}" data-d="Call technician">${IC.wrench}Call technician</button><span class="spacer"></span><button class="btn sec" data-do="${a.id}" data-d="Mark as OK">${IC.shield}Mark as OK</button>`}</div></article>`).join("") : `<p class="empty">No open alerts. Every decision is logged below.</p>`}</div>
    <h2 class="sec">Logged today</h2>
    <div class="alerts">${decided.map((a) => `<article class="card al"><div class="ah"><h3 style="margin:0">${a.title}</h3><p>${a.reason}</p><p style="margin-top:10px"><span class="logged ${state.decisions[a.id] === "Mark as OK" ? "ok" : state.decisions[a.id] === "Call technician" ? "rust" : ""}">Decision logged: ${state.decisions[a.id]} · ${NOW} · you</span></p></div></article>`).join("")}
      ${EARLIER.map(([t, r, tm, d, c]) => `<article class="card al"><div class="ah"><h3 style="margin:0">${t}</h3><p>${r}</p><p style="margin-top:10px"><span class="logged ${c}">Decision logged: ${d} · ${tm}</span></p></div></article>`).join("")}</div>
    ${Object.keys(state.decisions).length ? `<button class="btn sec reset" data-reset="1">Reset the demo</button>` : ""}`;
  },
  members: () => `${head("Members", "Sessions this month: who, how long and what they used")}
    <table class="tbl"><thead><tr><th>Member</th><th>Sessions</th><th>Time</th><th>Wire</th><th>Filament</th><th>Laser on</th><th>Spindle</th></tr></thead><tbody>
    ${MEMBERS.map((m) => `<tr><td><span class="nm">${m.name}</span>${m.flag ? `<br><span class="chip flag" style="margin-top:6px">${IC.flag}Flagged for review</span>` : ""}
      <details><summary>Recent sessions</summary><ul class="sess">${m.log.map((l) => `<li>${l}</li>`).join("")}</ul>${m.flag ? `<p class="lbl" style="margin:6px 0 0">${m.flag}. A review for the owner, not an accusation.</p>` : ""}</details></td>
      <td class="num" data-k="Sessions">${m.sessions}</td><td class="num" data-k="Time">${Math.floor(m.min / 60)} h ${m.min % 60} min</td><td class="num" data-k="Wire">${m.wire} g</td><td class="num" data-k="Filament">${m.fil} g</td><td class="num" data-k="Laser on">${m.laser} min</td><td class="num" data-k="Spindle">${m.spindle} min</td></tr>`).join("")}
    </tbody></table>
    <p class="note">Every session adds who, how long and the resource used to the member's record. Demo data.</p>`,
  resources: () => {
    const tot = { wire: 0, fil: 0, laser: 0, spindle: 0 }; MEMBERS.forEach((m) => { for (const k in tot) tot[k] += m[k]; });
    const bars = (rows, max, unit) => rows.map(([n, v]) => `<div class="bar"><span>${n}</span><span class="track"><span class="fill" style="width:${(v / max * 100).toFixed(1)}%;display:block"></span></span><span class="v">${v} ${unit}</span></div>`).join("");
    return `${head("Resources", "Totals this month, per resource and per machine")}
    <div class="bars">
      <section class="card"><p class="lbl">Welding wire · Welder 2</p><p class="big">${tot.wire} g</p><p class="lbl" style="margin-top:4px">$${(tot.wire * 0.1).toFixed(2)} at $0.10 a gram</p>${bars(MEMBERS.map((m) => [m.name.split(" ")[0], m.wire]), 320, "g")}</section>
      <section class="card"><p class="lbl">Shielding gas · Welder 2</p><p class="big">8 h 00 min</p><p class="lbl" style="margin-top:4px">valve open time, only during fob sessions</p>${bars([["Amira", 230], ["Priya", 250], ["Jonah", 0], ["Lucas", 0]], 260, "min")}</section>
      <section class="card"><p class="lbl">Filament · all printers</p><p class="big">${tot.fil} g</p><p class="lbl" style="margin-top:4px">from the spool scales</p>${bars([["3D printer 4", 352], ["3D printer 2", 182], ["Multimaker 1", 84]], 360, "g")}</section>
      <section class="card"><p class="lbl">Laser tube · Laser 1</p><p class="big">${tot.laser} min</p><p class="lbl" style="margin-top:4px">laser-on minutes</p>${bars(MEMBERS.map((m) => [m.name.split(" ")[0], m.laser]), 70, "min")}</section>
      <section class="card"><p class="lbl">CNC spindle · Multimaker 1</p><p class="big">${tot.spindle} min</p><p class="lbl" style="margin-top:4px">spindle running minutes</p>${bars(MEMBERS.map((m) => [m.name.split(" ")[0], m.spindle]), 100, "min")}</section>
    </div>
    <p class="note">Illustrative totals for a concept. Rates follow Grey Bruce Makers and the University of Regina ($0.10 a gram).</p>`;
  },
  manuals: () => `${head("Manuals", "One QR manual per machine, on a sticker beside the reader")}
    <div class="alerts" style="max-width:900px">${[["Welder 2", "welder-2", "3 Nov 2026"], ["3D printer 4", "printer-4", "3 Nov 2026"], ["Laser 1", "laser-1", "3 Nov 2026"], ["Multimaker 1", null, null], ["3D printer 2", null, null]].map(([n, h, d]) => `<article class="card man">
      <svg class="qr" viewBox="0 0 21 21" aria-hidden="true">${qr(n)}</svg>
      <div><h3>${n}</h3><p>${d ? `Last reviewed by the Tool Champion · ${d} (demo date)` : "Draft, waiting for the Tool Champion's review"}</p></div>
      ${h ? `<a class="btn pr" href="${MANUAL}#${h}" target="_blank" rel="noopener">${IC.book}Open manual</a>` : `<span class="btn sec" aria-disabled="true">Draft</span>`}</article>`).join("")}</div>
    <p class="note">Draft manuals for a prototype. Each makerspace's Tool Champion reviews and approves them.</p>`,
};
function qr(seed) {
  let s = ""; const h = [...seed].reduce((a, c) => a + c.charCodeAt(0), 0);
  const f = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#1F3D2B"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#FFFDF8"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#1F3D2B"/>`;
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) { const inF = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12); if (!inF && rnd(x * 31 + y * 7 + h) > 0.52) s += `<rect x="${x}" y="${y}" width="1" height="1" fill="#1F3D2B"/>`; }
  return s + f(0, 0) + f(14, 0) + f(0, 14);
}
const main = document.getElementById("main");
function render(focus) {
  document.querySelectorAll(".tab").forEach((b) => (b.dataset.v === view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
  document.getElementById("count").textContent = openAlerts().length || "";
  main.innerHTML = V[view]();
  if (focus) main.focus({ preventScroll: true });
}
document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => { view = b.dataset.v; state.confirm = null; try { history.replaceState(null, "", "#" + view); } catch (e) {} render(true); window.scrollTo(0, 0); }));
main.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-go]"); if (!t) return;
  if (t.dataset.go) { view = t.dataset.go; render(true); window.scrollTo(0, 0); return; }
  if (t.dataset.ask) { state.confirm = t.dataset.ask; render(); return; }
  if (t.dataset.cancel) { state.confirm = null; render(); return; }
  if (t.dataset.do) { state.decisions[t.dataset.do] = t.dataset.d; state.confirm = null; save(); render(); return; }
  if (t.dataset.reset) { state.decisions = {}; save(); render(); }
});
const start = location.hash.slice(1);
if (V[start]) view = start;
render();
// live charts: once a second, never in a hidden tab, frozen for reduced motion
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!reduce) setInterval(() => {
  if (document.hidden || view !== "machines") return;
  tick++;
  document.querySelectorAll(".spark[data-m]").forEach((el) => { const m = MACHINES.find((x) => x.id === el.dataset.m); el.querySelector("svg").outerHTML = spark(m); });
}, 1000);
</script>
